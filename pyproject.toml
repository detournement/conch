[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "conch-shell"
dynamic = ["version"]
description = "LLM-assisted shell with chat, MCP tools, memory, and scheduling."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "pygments>=2.0",
]

[project.scripts]
conch = "conch.app:main"
conch-chat = "conch.app:main"
conch-ask = "conch.cli:main"
# Swarm entrypoints. conch-edge is live (Phase 1): the personal edge daemon
# owning the mission kernel, gated on edge_daemon=true. The others remain
# dormant — each prints a "not yet enabled" notice and exits nonzero until
# its phase lands.
conch-controller = "conch.entrypoints:controller_main"
conch-edge = "conch.entrypoints:edge_main"
conch-worker = "conch.entrypoints:worker_main"
conch-hostctl = "conch.entrypoints:hostctl_main"

[project.urls]
Homepage = "https://github.com/detournement/conch"
Repository = "https://github.com/detournement/conch"

[tool.setuptools.dynamic]
version = {attr = "conch.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["conch*"]

[tool.setuptools.package-data]
# Flow packs shipped with conch (declarative Capitol use cases; the
# manifests are data the pack engine validates and executes).
"conch.capitol.packs" = [
    "data/*/pack.json",
    "data/*/README.md",
    "data/*/assets/*",
]
