# Sovereign phone stack: Conduit (Matrix homeserver) + ntfy (push).
#
#   docker compose -f deploy/docker-compose.phone.yml up -d
#   deploy/phone-bootstrap.sh          # users, token file, DM room
#
# Images are pinned by digest (a tag can move; a digest cannot):
#   matrixconduit/matrix-conduit v0.10.10
#   binwiederhier/ntfy           v2.14.0
#
# Sovereignty posture:
# - Both services bind to 127.0.0.1 by default. To reach them from your
#   phone, either put them behind your own TLS reverse proxy, or (the
#   simple sovereign default) bind them to your tailnet IP by setting
#   PHONE_BIND_ADDR in the .env file next to this compose file — the
#   tailnet already encrypts the transport, so plain HTTP over it is
#   TLS-equivalent in practice and no port is ever public.
# - Federation is OFF: this homeserver talks to your own clients only.
# - Registration needs the token in .env (phone-bootstrap.sh generates
#   it). After bootstrapping your two users, you can set
#   CONDUIT_ALLOW_REGISTRATION=false and `up -d` again to close it.
#
# .env keys used here:
#   PHONE_BIND_ADDR      default 127.0.0.1 (set your tailnet IP)
#   PHONE_SERVER_NAME    default conch.local
#   CONDUIT_REGISTRATION_TOKEN   generated by phone-bootstrap.sh

name: conch-phone

services:
  conduit:
    image: matrixconduit/matrix-conduit@sha256:4e69d5335dff124bab87fc0c5fbb506b931ed294cb0f2bddf0c10b0e39953594
    restart: unless-stopped
    ports:
      - "${PHONE_BIND_ADDR:-127.0.0.1}:${PHONE_MATRIX_PORT:-6167}:6167"
    environment:
      CONDUIT_SERVER_NAME: "${PHONE_SERVER_NAME:-conch.local}"
      CONDUIT_ADDRESS: "0.0.0.0"
      CONDUIT_PORT: "6167"
      CONDUIT_DATABASE_BACKEND: "rocksdb"
      CONDUIT_DATABASE_PATH: "/var/lib/matrix-conduit/"
      CONDUIT_ALLOW_REGISTRATION: "${CONDUIT_ALLOW_REGISTRATION:-true}"
      CONDUIT_REGISTRATION_TOKEN: "${CONDUIT_REGISTRATION_TOKEN:-}"
      CONDUIT_ALLOW_FEDERATION: "false"
      CONDUIT_ALLOW_CHECK_FOR_UPDATES: "false"
      CONDUIT_MAX_REQUEST_SIZE: "20000000"
    volumes:
      - conduit-db:/var/lib/matrix-conduit

  ntfy:
    image: binwiederhier/ntfy@sha256:5a051798d14138c3ecb12c038652558ab6a077e1aceeb867c151cbf5fa8451ef
    restart: unless-stopped
    command: serve
    ports:
      - "${PHONE_BIND_ADDR:-127.0.0.1}:${PHONE_NTFY_PORT:-8093}:80"
    environment:
      NTFY_BASE_URL: "${PHONE_NTFY_BASE_URL:-http://localhost:8093}"
      NTFY_CACHE_FILE: "/var/cache/ntfy/cache.db"
      NTFY_AUTH_FILE: "/var/lib/ntfy/auth.db"
      # Open by default on a private bind. To require auth on every
      # topic, set NTFY_AUTH_DEFAULT_ACCESS=deny-all in .env, then:
      #   docker compose -f deploy/docker-compose.phone.yml exec ntfy \
      #     ntfy user add --role=admin conch
      #   docker compose ... exec ntfy ntfy token add conch
      # and export the printed token as NTFY_TOKEN for the daemon.
      NTFY_AUTH_DEFAULT_ACCESS: "${NTFY_AUTH_DEFAULT_ACCESS:-read-write}"
    volumes:
      - ntfy-cache:/var/cache/ntfy
      - ntfy-auth:/var/lib/ntfy

volumes:
  conduit-db:
  ntfy-cache:
  ntfy-auth:
