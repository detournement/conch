<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Workflow console</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <main>
      <header>
        <h1 id="app-title">Workflow console</h1>
        <p class="muted" id="app-intro"></p>
      </header>

      <div class="error-banner" id="error-banner" hidden></div>

      <section class="panel" id="setup-panel" hidden>
        <h2>Connect to the agent</h2>
        <p class="muted">
          Paste the agent API token (<code>cap_a2a_&hellip;</code>). It is kept in this
          browser's local storage only and sent only to the configured gateway.
        </p>
        <div class="field-row">
          <label for="token-input">Agent token</label>
          <input type="password" id="token-input" autocomplete="off" />
        </div>
        <button id="save-token-btn">Connect</button>
      </section>

      <section class="panel" id="form-panel" hidden>
        <h2 id="form-title">Request</h2>
        <form id="workflow-form">
          <div id="form-fields"></div>
          <button type="submit" id="run-btn">Run</button>
        </form>
      </section>

      <section class="panel" id="run-panel" hidden>
        <h2>Run progress</h2>
        <p class="muted" id="run-meta"></p>
        <div id="run-view"></div>
        <div class="hitl" id="hitl-panel" hidden>
          <h3>The workflow needs your input</h3>
          <p id="hitl-prompt"></p>
          <div id="hitl-controls"></div>
        </div>
      </section>

      <section class="panel" id="output-panel" hidden>
        <h2>Deliverables</h2>
        <div id="output-view"></div>
        <button class="secondary" id="restart-btn">Start over</button>
      </section>
    </main>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
